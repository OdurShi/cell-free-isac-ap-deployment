# max-min problem, 2T2R (M + N = 4)
# Sensing value: determinant of the FIM exactly as printed in Eq. (8).
n_tx: 2
n_rx: 2
aggregation: max-min
sensing_metric: eq8

# Deployment region of Eq. (16), in metres (not stated in the paper; see implementation notes).
x_min: 0.0
x_max: 50.0
y_min: 0.0
y_max: 50.0
grid_step: 10.0            # spacing of the candidate AP sites (discretised action space)

# Target on a circular trajectory (Section 4), sampled at Q points.
target_center: [25.0, 25.0]
target_radius: 10.0
n_trajectory_points: 25
trajectory_endpoint: true

# Three UEs, Gaussian with variance 2 (Section 4) around these centres.
ue_centers: [[25.0, 45.0], [10.0, 15.0], [40.0, 10.0]]
ue_variance: 2.0

log_base: 10.0             # base of the logarithm in Eq. (15)
one_plus_snr: true         # log(1 + SNR), first line of Eq. (15)
objective: isac            # Eq. (17); alternatives: sensing | communication | weighted
weight: 0.5
reward_scale: 1.0
episode_length: 256
